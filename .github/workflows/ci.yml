# Runs on every push and pull request. A red X on GitHub means: don't merge/deploy.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Real MySQL and Redis servers for the tests, started next to the job.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ridemate
          MYSQL_USER: ridemate
          MYSQL_PASSWORD: ridemate
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
    env:
      DATABASE_URL: mysql+aiomysql://ridemate:ridemate@127.0.0.1:3306/ridemate?charset=utf8mb4
      JWT_SECRET_KEY: ci-only-secret-used-nowhere-else-0123456789
      TEST_REDIS_URL: redis://127.0.0.1:6379/15  # Redis tests hit a real server here
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Every migration can be rolled back and re-applied
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Both images build
        run: |
          docker build -t ridemate-api backend
          docker build -t ridemate-web frontend

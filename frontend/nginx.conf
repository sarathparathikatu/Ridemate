server {
    listen 80;
    root /usr/share/nginx/html;

    # The API lives behind the same address as the site (/api/...), so the browser makes
    # same-origin requests and no CORS is involved. "api" is the compose service name.
    location /api/ {
        proxy_pass http://api:8000/;  # trailing slash strips the /api prefix
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets need the HTTP "Upgrade" handshake passed through, and a long timeout.
    location = /api/ws {
        proxy_pass http://api:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    # The service worker must never be cached, or users stay stuck on an old app version.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Built files have content hashes in their names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any other path (/rides, /share/abc...) gets index.html and React
    # Router picks the screen.
    location / {
        try_files $uri /index.html;
    }
}
